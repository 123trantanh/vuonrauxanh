<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Vườn Xanh</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lexend:wght@500;600;700&display=swap">
<style>
/* Layout: sticky header, full-width bands with a centred 1180px wrapper; the garden map is drawn like a site plan with a central path */
:root{
  --bg:#f5f9f3; --surface:#ffffff; --soft:#e6f2e2; --soft2:#f0f7ed; --ink:#1c2a1e; --muted:#566857; --line:#d3e2cf;
  --green:#2e7a39; --green-d:#22602b; --on-green:#ffffff; --earth:#8a5a34; --earth-soft:#f2e7da;
  --path:#e8d9c2; --path-ink:#7b5a3a; --shadow:0 1px 2px rgba(30,60,30,.08),0 6px 18px rgba(30,60,30,.07);
  --ok:#2e7a39; --warn:#a46f00; --bad:#b33a36; --info:#2c6bb0;
  --st-used:#6cc070; --st-empty:#ffffff; --st-pend:#f5cd4f; --st-sale:#64a3e6; --st-maint:#e7716d; --plot-ink:#16231a;
  --f-body:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-head:'Lexend','Be Vietnam Pro',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111a13; --surface:#18231a; --soft:#1f2f21; --soft2:#1a281c; --ink:#e4eee2; --muted:#a2b5a2; --line:#2c3e2e;
  --green:#71c27d; --green-d:#94d69e; --on-green:#0e1a10; --earth:#d1a37b; --earth-soft:#2b2219;
  --path:#3a2f22; --path-ink:#d8bf9c; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);
  --ok:#71c27d; --warn:#f0c24f; --bad:#f08a85; --info:#8cbcf0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111a13; --surface:#18231a; --soft:#1f2f21; --soft2:#1a281c; --ink:#e4eee2; --muted:#a2b5a2; --line:#2c3e2e;
  --green:#71c27d; --green-d:#94d69e; --on-green:#0e1a10; --earth:#d1a37b; --earth-soft:#2b2219;
  --path:#3a2f22; --path-ink:#d8bf9c; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);
  --ok:#71c27d; --warn:#f0c24f; --bad:#f08a85; --info:#8cbcf0; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16.5px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
h1,h2,h3,h4{font-family:var(--f-head);line-height:1.25;text-wrap:balance;margin:0}
h2{font-size:clamp(1.4rem,2.6vw,1.85rem)} h3{font-size:1.15rem}
p{margin:0}
a{color:var(--green)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--earth);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page{padding-block:28px 56px;display:flex;flex-direction:column;gap:24px}
.muted{color:var(--muted)} .small{font-size:.9rem} .num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--earth)}
.sec-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:12px}
.sec-head>div{display:flex;flex-direction:column;gap:4px;min-width:0}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:14px;min-height:66px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);flex-shrink:0}
.logo b{font-family:var(--f-head);font-size:1.25rem;letter-spacing:.02em;color:var(--green-d)}
.logo small{display:block;font-size:.68rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;line-height:1}
nav.main{display:flex;gap:2px;flex:1;flex-wrap:wrap}
nav.main a{padding:8px 11px;border-radius:8px;text-decoration:none;color:var(--ink);font-weight:500;font-size:.95rem}
nav.main a:hover{background:var(--soft)}
nav.main a.on{background:var(--soft);color:var(--green-d);font-weight:700}
.top-tools{display:flex;align-items:center;gap:6px;margin-left:auto}
.icon-btn{position:relative;display:inline-grid;place-items:center;width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-decoration:none;color:var(--ink)}
.icon-btn:hover{background:var(--soft)}
.icon-btn svg{width:22px;height:22px}
.badge{position:absolute;top:-5px;right:-5px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--bad);color:#fff;font-size:.72rem;font-weight:700;display:grid;place-items:center}
.menu-btn{display:none}
@media (max-width:1060px){
  .menu-btn{display:inline-grid}
  nav.main{display:none;position:absolute;left:0;right:0;top:100%;background:var(--surface);border-bottom:1px solid var(--line);flex-direction:column;padding:8px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));box-shadow:var(--shadow)}
  nav.main.open{display:flex}
  nav.main a{padding:12px 14px;font-size:1.05rem}
}
.acct-name{max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:520px){.acct-name{display:none}.logo small{display:none}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:9px 18px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--green)}
.btn.primary{background:var(--green);border-color:var(--green);color:var(--on-green)}
.btn.primary:hover{background:var(--green-d);border-color:var(--green-d)}
.btn.earth{background:var(--earth);border-color:var(--earth);color:var(--on-green)}
.btn.info{background:var(--info);border-color:var(--info);color:var(--on-green)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:36px;padding:5px 12px;font-size:.88rem;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn-row{display:flex;flex-wrap:wrap;gap:10px}

/* hero */
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line);background:#e6f3ee}
.hero-art{position:absolute;inset:0;width:100%;height:100%}
.hero-in{position:relative;padding-block:46px 150px}
.hero-card{max-width:600px;background:rgba(248,252,244,.9);border-radius:16px;padding:26px 28px;display:flex;flex-direction:column;gap:14px;color:#17321d;box-shadow:0 10px 30px rgba(20,60,20,.14)}
.hero-card .eyebrow{color:#7a4f2c}
.hero-card h1{font-size:clamp(1.6rem,3.6vw,2.45rem);color:#17401f}
.hero-card p{color:#33503a;font-size:1.05rem}
.hero-card .btn{border-color:#b8d3b0;background:#fff;color:#17321d}
.hero-card .btn.primary{background:#2e7a39;border-color:#2e7a39;color:#fff}
.hero-stats{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:.92rem;color:#33503a}
.hero-stats b{font-family:var(--f-head);font-size:1.25rem;color:#17401f;display:block;line-height:1.1}
@media (max-width:600px){.hero-in{padding-block:20px 120px}.hero-card{padding:20px}}

/* bands */
.band{padding-block:44px}
.band.alt{background:var(--soft2);border-block:1px solid var(--line)}
.band>.wrap{display:flex;flex-direction:column;gap:20px}

/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.card .art,.card .pimg{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;max-width:100%;background:var(--soft)}
.card-b{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1;min-width:0}
.card-b h3{font-size:1.08rem}
.card-b .btn-row{margin-top:auto;padding-top:6px}
.price{font-family:var(--f-head);font-weight:700;color:var(--green-d);font-size:1.15rem}
.price small{font-family:var(--f-body);font-weight:500;color:var(--muted);font-size:.85rem}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.9rem;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel h3{display:flex;align-items:center;gap:8px}
.note-box{border-left:4px solid var(--earth);background:var(--earth-soft);padding:12px 16px;border-radius:0 10px 10px 0;font-size:.95rem}
.note-box.blue{border-color:var(--info);background:var(--soft2)}
.empty-state{padding:30px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:14px}

/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.82rem;font-weight:600;border:1px solid var(--line);white-space:nowrap;background:var(--soft2)}
.dot{width:12px;height:12px;border-radius:3px;border:1px solid rgba(0,0,0,.35);flex-shrink:0}
.pill.ok{color:var(--ok);border-color:var(--ok)} .pill.warn{color:var(--warn);border-color:var(--warn)} .pill.bad{color:var(--bad);border-color:var(--bad)} .pill.info{color:var(--info);border-color:var(--info)}

/* garden map */
.legend{display:flex;flex-wrap:wrap;gap:8px}
.legend button{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-size:.92rem}
.legend button.on{border-color:var(--green);background:var(--soft)}
.legend .dot{width:16px;height:16px}
.map-box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px;align-items:center}
.map{display:grid;grid-template-columns:minmax(0,1fr) 64px minmax(0,1fr);gap:12px;width:100%;max-width:900px;background:repeating-linear-gradient(45deg,var(--soft2) 0 10px,var(--soft) 10px 20px);padding:14px;border-radius:12px;border:2px solid var(--green)}
.zone{display:flex;flex-direction:column;gap:8px;min-width:0}
.zone-h{font-family:var(--f-head);font-weight:600;font-size:.85rem;letter-spacing:.06em;text-align:center;color:var(--green-d)}
.blocks{display:flex;flex-direction:column;gap:18px}
.plots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.plot{position:relative;aspect-ratio:5/3;border-radius:6px;border:1.5px solid rgba(20,40,20,.45);color:var(--plot-ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px;font-family:var(--f-head);font-weight:700;font-size:clamp(.72rem,1.6vw,1rem);line-height:1.1;transition:transform .12s, box-shadow .12s;min-width:0}
.plot small{font-family:var(--f-body);font-weight:500;font-size:.72rem;opacity:.8}
.plot:hover{transform:translateY(-2px);box-shadow:0 4px 10px rgba(0,0,0,.18)}
.st-used{background:var(--st-used)} .st-empty{background:var(--st-empty)} .st-pend{background:var(--st-pend);border-style:dashed}
.st-sale{background:var(--st-sale)}
.st-maint{background:repeating-linear-gradient(135deg,var(--st-maint) 0 7px,#f1a19e 7px 13px)}
.plot.dim{opacity:.22}
.plot.hl{outline:4px solid var(--earth);outline-offset:2px;z-index:2;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{outline-offset:6px}}
@media (prefers-reduced-motion:reduce){.plot.hl{animation:none}.plot{transition:none}}
.path{background:var(--path);border-radius:8px;display:flex;align-items:center;justify-content:center;border:1px dashed var(--path-ink)}
.path span{writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--f-head);font-weight:600;letter-spacing:.3em;color:var(--path-ink);font-size:.82rem}
.map-frame{width:100%;max-width:760px;display:flex;flex-direction:column}
.map-frame.mini{max-width:520px}
.gate{align-self:flex-end;font-size:.9rem;font-weight:700;color:var(--path-ink);background:var(--path);padding:4px 18px;border-radius:0 0 10px 10px;border:1px dashed var(--path-ink);border-top:0}
@media (max-width:560px){.map{grid-template-columns:minmax(0,1fr) 30px minmax(0,1fr);gap:6px;padding:8px}.plots{gap:4px}.blocks{gap:12px}.map-box{padding:10px}.path span{font-size:.62rem;letter-spacing:.12em}}
.mini .plot small{display:none}

/* forms */
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form-grid .full{grid-column:1/-1}
@media (max-width:620px){.form-grid{grid-template-columns:minmax(0,1fr)}}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-weight:600;font-size:.93rem}
input:not([type=checkbox]):not([type=radio]):not([type=file]),select,textarea{width:100%;min-height:46px;padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface)}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--green);outline:none;box-shadow:0 0 0 3px var(--soft)}
.check{display:flex;align-items:center;gap:8px;font-weight:500}
.check input{width:20px;height:20px;accent-color:var(--green)}
.radio-card{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;cursor:pointer}
.radio-card:has(input:checked){border-color:var(--green);background:var(--soft2)}
.radio-card input{width:20px;height:20px;margin-top:3px;accent-color:var(--green)}
.radio-card.off{opacity:.55;cursor:not-allowed}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.img-prev{width:120px;aspect-ratio:4/3;object-fit:cover;border-radius:8px;border:1px solid var(--line)}

/* tabs & tables */
.tabs{display:flex;gap:6px;overflow-x:auto;border-bottom:1px solid var(--line);padding-bottom:0}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button.on{color:var(--green-d);border-color:var(--green)}
.tabs .badge{position:static;display:inline-grid;margin-left:4px}
.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:.93rem}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--soft2);white-space:nowrap}
tr:last-child td{border-bottom:0}
td .btn-row{flex-wrap:nowrap;gap:6px}
td input,td select{min-height:36px!important;padding:4px 8px!important;width:auto!important;max-width:130px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.stat span{font-size:.85rem;color:var(--muted)}
.stat b{font-family:var(--f-head);font-size:1.5rem;font-variant-numeric:tabular-nums;color:var(--green-d)}
.stat.earth b{color:var(--earth)}

/* layout helpers */
.two{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:860px){.two{grid-template-columns:minmax(0,1fr)}}
.side-layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:22px;align-items:start}
.side-nav{display:flex;flex-direction:column;gap:4px;position:sticky;top:calc(80px + env(safe-area-inset-top,0px))}
.side-nav button{text-align:left;border:0;background:none;padding:10px 12px;border-radius:8px;font-weight:600;color:var(--muted);cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:6px}
.side-nav button.on{background:var(--soft);color:var(--green-d)}
.side-nav .badge{position:static}
@media (max-width:860px){.side-layout{grid-template-columns:minmax(0,1fr)}.side-nav{position:static;flex-direction:row;overflow-x:auto}.side-nav button{white-space:nowrap}}
.list{display:flex;flex-direction:column;gap:10px}
.row-item{display:flex;flex-wrap:wrap;gap:10px 16px;justify-content:space-between;align-items:center;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.row-item>div{min-width:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:.95rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600;min-width:0}

/* timeline */
.steps{display:flex;flex-wrap:wrap;gap:4px;font-size:.78rem}
.steps span{padding:3px 8px;border-radius:6px;background:var(--soft2);color:var(--muted)}
.steps span.done{background:var(--soft);color:var(--green-d);font-weight:700}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(10,25,12,.55);z-index:100;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border-radius:16px;width:100%;max-width:720px;box-shadow:0 20px 60px rgba(0,0,0,.35);display:flex;flex-direction:column;margin-block:auto}
.modal-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-b{padding:20px;display:flex;flex-direction:column;gap:16px}
.modal-x{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:1.4rem;line-height:1}
.plot-info{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.plot-info .art,.plot-info img{width:100%;border-radius:10px;aspect-ratio:8/5;object-fit:cover;max-width:100%}
@media (max-width:620px){.plot-info{grid-template-columns:minmax(0,1fr)}}

/* chat */
.chat{display:grid;grid-template-columns:280px minmax(0,1fr);border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface);min-height:520px}
.threads{border-right:1px solid var(--line);display:flex;flex-direction:column;overflow-y:auto;max-height:620px}
.threads button{text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.threads button.on{background:var(--soft)}
.threads button .small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conv{display:flex;flex-direction:column;min-width:0}
.conv-h{padding:12px 16px;border-bottom:1px solid var(--line);font-weight:700}
.msgs{flex:1;padding:16px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;max-height:480px;background:var(--soft2)}
.msg{max-width:78%;padding:9px 13px;border-radius:14px;background:var(--surface);border:1px solid var(--line);align-self:flex-start;overflow-wrap:anywhere}
.msg.mine{align-self:flex-end;background:var(--green);border-color:var(--green);color:var(--on-green)}
.msg time{display:block;font-size:.72rem;opacity:.75}
.chat form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.quick{display:flex;flex-wrap:wrap;gap:6px;padding:8px 12px 0}
.quick button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:.82rem;cursor:pointer}
@media (max-width:760px){.chat{grid-template-columns:minmax(0,1fr)}.threads{border-right:0;border-bottom:1px solid var(--line);max-height:200px}}

/* cart */
.qty{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.qty button{width:40px;height:40px;border:0;background:var(--soft2);cursor:pointer;font-size:1.2rem}
.qty input{width:58px!important;min-height:40px!important;border:0!important;border-radius:0!important;text-align:center;padding:0!important}
.stars{color:#d79a12;letter-spacing:1px}

/* steps band */
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;counter-reset:s}
.how div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:6px}
.how div::before{counter-increment:s;content:"Bước " counter(s);font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--earth)}

/* footer */
footer{background:#1f4d26;color:#eaf5e6;padding-block:40px 30px}
footer .wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:26px}
footer h4{font-size:1rem;margin-bottom:8px;color:#fff}
footer a,footer button.link{color:#d6ecd0;text-decoration:none;background:none;border:0;padding:3px 0;cursor:pointer;text-align:left;font-size:.95rem}
footer a:hover,footer button.link:hover{text-decoration:underline}
footer ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
footer .copy{grid-column:1/-1;border-top:1px solid rgba(255,255,255,.18);padding-top:16px;font-size:.85rem;color:#bcd8b5}

/* toast */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(560px,calc(100% - 32px))}
.toast{background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;box-shadow:var(--shadow);font-weight:500;text-align:center}
.demo-acc{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.demo-acc button{text-align:left;padding:12px 14px;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.demo-acc button:hover{border-color:var(--green)}
</style>

<script>
/* ===================== DỮ LIỆU & LƯU TRỮ =====================

   Khi triển khai thật, thay các hàm load()/save() bằng lời gọi API tới máy chủ + CSDL. */
const LS_KEY='vuonxanh_demo_v2';

    {id:'u2',name:'Nguyễn Thị Lan',phone:'0901234567',email:'lan@example.com',pass:'123456',role:'owner',locked:false,addresses:['12 Hẻm 5, Phường An Lạc'],joined:agoISO(300)},
    {id:'u3',name:'Trần Văn Hùng',phone:'0912345678',email:'hung@example.com',pass:'123456',role:'owner',locked:false,addresses:['88 Đường Số 3, Phường Tân Tạo'],joined:agoISO(280)},

  const deals=[{id:'GD'+(++seq),listingId:listings[2].id,plotId:P('B05').id,buyerId:'u4',sellerId:'u2',offer:listings[2].price-5000000,msg:'Tôi muốn mua ô B05, có thể giảm 5 triệu không ạ?',status:'requested',date:agoISO(2)}];

  const products=[
    pr('sp1','A01','u2','Rau muống','Rau ăn lá',15000,50,'kg',-1,'Rau muống ta trồng không thuốc trừ sâu, tưới nước giếng khoan đã lọc. Cắt buổi sáng, giao trong ngày.'),
    pr('sp2','A02','u2','Cải ngọt','Rau ăn lá',18000,30,'kg',-2,'Cải ngọt non, lá xanh mướt, bón phân hữu cơ ủ từ bã đậu.'),
    pr('sp3','B02','u3','Mồng tơi','Rau ăn lá',16000,25,'kg',0,'Mồng tơi lá to, nấu canh cua rất ngọt. Hái theo đơn đặt.'),
    pr('sp4','B03','u3','Rau ngót','Rau ăn lá',20000,20,'kg',3,'Rau ngót non, tuốt sẵn lá nếu khách yêu cầu.'),
    pr('sp5','A05','u5','Xà lách','Rau ăn lá',35000,15,'kg',-3,'Xà lách búp mỡ, giòn, trồng trong nhà lưới che mưa.'),
    pr('sp6','A07','u5','Dưa leo','Rau ăn quả',22000,40,'kg',2,'Dưa leo giống ta, trái vừa tay, giòn và ít hạt.'),
    pr('sp7','B07','u3','Cà chua','Rau ăn quả',30000,35,'kg',-1,'Cà chua chín cây, vị chua ngọt tự nhiên.'),
    pr('sp8','A09','u2','Hành lá','Rau gia vị',40000,8,'kg',-4,'Hành lá thơm, bán theo kg hoặc bó nhỏ.'),
    pr('sp9','B09','u5','Rau dền','Rau ăn lá',14000,22,'kg',5,'Rau dền đỏ, nhặt sạch, đóng túi 500g.'),
    pr('sp10','B10','u2','Đậu bắp','Rau ăn quả',25000,18,'kg',1,'Đậu bắp non, hái trái nhỏ dưới 10 cm.',['Nhận tại vườn']),
  ];
  const mkO=(id,buyer,seller,items,status,days,pay)=>{const sub=items.reduce((s,i)=>s+i.price*i.qty,0);const ship=sub>=200000?0:15000;const hist=[];
    for(const s of OFLOW){hist.push({s,t:agoISO(days)});if(s===status)break}
    return {id,buyerId:buyer,sellerId:seller,items,subtotal:sub,ship,total:sub+ship,pay:pay||'cod',name:'Lê Minh Anh',phone:'0987654321',address:'45 Đường Số 7, Phường Bình Trị Đông',note:'',status,history:hist,stockDeducted:status!=='pending',paid:status==='completed',date:agoISO(days)}};
  const it=(pid,qty)=>{const p=products.find(x=>x.id===pid);return {pid,name:p.name,price:p.price,qty,unit:p.unit}};
  const orders=[mkO('DH1001','u4','u2',[it('sp1',3),it('sp2',2)],'completed',8),mkO('DH1002','u4','u3',[it('sp7',2),it('sp3',1)],'shipping',1,'bank'),mkO('DH1003','u4','u5',[it('sp5',1)],'pending',0),
    mkO('DH1004','u6','u2',[it('sp1',5),it('sp8',1)],'completed',5)];
  orders[3].name='Võ Thanh Bình';orders[3].phone='0977111222';orders[3].address='Nhận tại vườn';
  const reviews=[{id:'dg1',pid:'sp1',userId:'u4',orderId:'DH1001',rating:5,text:'Rau muống giòn, sạch, giao nhanh. Sẽ mua tiếp.',date:agoISO(6),hidden:false},
    {id:'dg2',pid:'sp1',userId:'u6',orderId:'DH1004',rating:4,text:'Rau tươi, bó hơi to so với nhà tôi.',date:agoISO(4),hidden:false},
    {id:'dg3',pid:'sp2',userId:'u4',orderId:'DH1001',rating:5,text:'Cải ngọt non, nấu canh rất ngon.',date:agoISO(6),hidden:false}];
  const msgs=[{id:'m1',from:'u4',to:'u2',text:'Chào cô Lan, rau muống sáng mai còn không ạ? Con muốn lấy 2kg.',time:agoISO(1),read:true},
    {id:'m2',from:'u2',to:'u4',text:'Còn con nhé, cô cắt lúc 6 giờ, 7 giờ giao tới nhà con được.',time:agoISO(1),read:false},
    {id:'m3',from:'u4',to:'u2',text:'Về ô đất B05, cô có bớt được chút nào không ạ?',time:agoISO(0),read:false}];
  const notifs=[{id:'n1',to:'admin',text:'Yêu cầu thuê mới: ô A06 từ Lê Minh Anh (0987654321).',link:'admin',time:agoISO(1),read:false},
    {id:'n2',to:'admin',text:'Yêu cầu thuê mới: ô B08 từ Võ Thanh Bình (0977111222).',link:'admin',time:agoISO(0),read:false},
    {id:'n3',to:'admin',text:'Tin đăng bán ô A02 của Nguyễn Thị Lan đang chờ kiểm duyệt.',link:'admin',time:agoISO(1),read:false},
    {id:'n4',to:'u2',text:'Lê Minh Anh gửi yêu cầu mua ô B05.',link:'land',time:agoISO(2),read:false},
    {id:'n5',to:'u5',text:'Đơn hàng mới DH1003 đang chờ bạn xác nhận.',link:'seller',time:agoISO(0),read:false}];
  return {v:2,seq:2000,session:null,users,plots,listings,rentals,deals,products,orders,reviews,msgs,notifs,feedback:[],carts:{},
    settings:{bank:'Ngân hàng mẫu · STK 0000 1111 2222 · Chủ tài khoản: BAN QUAN LY VUON XANH (thông tin mẫu, cập nhật khi triển khai)',shipFee:15000,freeShip:200000}};
}
const OFLOW=['pending','confirmed','preparing','shipping','delivered','completed'];
function load(){try{const s=localStorage.getItem(LS_KEY);if(s){DB=JSON.parse(s);if(DB&&DB.v===2)return}}catch(e){}DB=seed()}
function save(){try{localStorage.setItem(LS_KEY,JSON.stringify(DB))}catch(e){toast('Trình duyệt không cho lưu dữ liệu (bộ nhớ đầy hoặc bị chặn). Thay đổi sẽ mất khi tải lại trang.')}}

/* ===================== TIỆN ÍCH ===================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>Math.round(n||0).toLocaleString('vi-VN')+' đ';
const short=n=>n>=1e9?(n/1e9).toLocaleString('vi-VN',{maximumFractionDigits:2})+' tỷ':n>=1e6?(n/1e6).toLocaleString('vi-VN',{maximumFractionDigits:1})+' triệu':money(n);
const fmtD=iso=>iso?new Date(iso).toLocaleDateString('vi-VN'):'';
const fmtT=iso=>new Date(iso).toLocaleString('vi-VN',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit'});
const me=()=>DB.users.find(u=>u.id===DB.session&&!u.locked)||null;
const role=()=>me()?.role||'guest';
const user=id=>DB.users.find(u=>u.id===id);
const uname=id=>user(id)?.name||'Ban quản lý Vườn Xanh';
const plot=id=>DB.plots.find(p=>p.id===id);
const prod=id=>DB.products.find(p=>p.id===id);
const nid=p=>p+(++DB.seq);
const now=()=>new Date().toISOString();
const phoneOK=s=>/^0\d{9}$/.test(String(s).replace(/[\s.]/g,''));
function notify(to,text,link){DB.notifs.unshift({id:nid('n'),to,text,link:link||'',time:now(),read:false})}
function posText(p){const list=sidePlots(p.side);const i=list.indexOf(p);return `Khu ${p.side} (${p.side==='A'?'bên trái':'bên phải'} lối đi) · Cụm ${Math.floor(i/4)+1} · Hàng ${Math.floor(i/2)+1} · Cột ${i%2+1}`}
function sidePlots(s){return DB.plots.filter(p=>p.side===s).sort((a,b)=>a.order-b.order)}
const PST={used:{t:'Đang sử dụng',c:'st-used',v:'--st-used'},empty:{t:'Đất trống, có thể thuê',c:'st-empty',v:'--st-empty'},pending:{t:'Đang có người đặt thuê',c:'st-pend',v:'--st-pend'},sale:{t:'Đang rao bán',c:'st-sale',v:'--st-sale'},maint:{t:'Bảo trì / tạm ngừng',c:'st-maint',v:'--st-maint'}};
const OST={pending:'Chờ xác nhận',confirmed:'Đã xác nhận',preparing:'Đang chuẩn bị hàng',shipping:'Đang giao hàng',delivered:'Đã giao hàng',completed:'Đã hoàn thành',cancelled:'Đã hủy'};
const OCLS={pending:'warn',confirmed:'info',preparing:'info',shipping:'info',delivered:'ok',completed:'ok',cancelled:'bad'};
const RST={pending:['Chờ xác nhận','warn'],approved:['Đang thuê','ok'],rejected:['Bị từ chối','bad'],ended:['Đã kết thúc','']};
const LST={pending:['Chờ kiểm duyệt','warn'],approved:['Đang rao bán','info'],rejected:['Bị từ chối','bad'],withdrawn:['Đã gỡ','' ],sold:['Đã chuyển nhượng','ok']};
const DST={requested:['Chờ người bán phản hồi','warn'],agreed:['Chờ Ban quản lý xác nhận chuyển nhượng','info'],completed:['Đã chuyển nhượng','ok'],declined:['Người bán từ chối','bad'],cancelled:['Đã hủy','bad']};
const ROLE={admin:'Quản trị viên',owner:'Chủ vườn',buyer:'Người mua',guest:'Khách'};
const TERMS={1:'1 tháng',6:'6 tháng (giảm 5%)',12:'1 năm (tặng 2 tháng)'};
const CATS=['Rau ăn lá','Rau ăn quả','Rau gia vị','Củ'];
const UNITS=['kg','bó','trái','hộp','túi 500g'];
const PAYMENT_METHODS={cod:{label:'Thanh toán khi nhận hàng (COD)',hint:'Trả tiền mặt cho người giao hoặc khi nhận tại vườn.',enabled:true},
  bank:{label:'Chuyển khoản ngân hàng',hint:'Chuyển khoản theo thông tin bên dưới, ghi mã đơn ở nội dung.',enabled:true},
  online:{label:'Cổng thanh toán trực tuyến',hint:'Ví điện tử, thẻ ATM/Visa. Sắp ra mắt.',enabled:false}};
/* Điểm tích hợp cổng thanh toán: khi có hợp đồng với VNPay / MoMo / ZaloPay..., hiện thực createPayment()
   gọi API máy chủ để tạo phiên thanh toán và trả về URL chuyển hướng; verify() xử lý kết quả IPN. */
const PaymentGateway={provider:null,async createPayment(order){throw new Error('Chưa tích hợp cổng thanh toán')},async verify(payload){return false}};
function rentTotal(p,term){term=+term;if(term===12)return p.priceYear;if(term===6)return Math.round(p.priceMonth*6*.95/1000)*1000;return p.priceMonth*term}
function pill(t,c){return `<span class="pill ${c||''}">${esc(t)}</span>`}
function stPill(st){const s=PST[st];return `<span class="pill"><span class="dot ${s.c}"></span>${s.t}</span>`}
function visibleProducts(){return DB.products.filter(p=>!p.hidden&&!p.adminHidden&&!user(p.sellerId)?.locked)}
function prodRating(pid){const r=DB.reviews.filter(x=>x.pid===pid&&!x.hidden);return r.length?{avg:r.reduce((s,x)=>s+x.rating,0)/r.length,n:r.length}:{avg:0,n:0}}
function prodSold(pid){return DB.orders.filter(o=>['delivered','completed'].includes(o.status)).reduce((s,o)=>s+o.items.filter(i=>i.pid===pid).reduce((a,i)=>a+i.qty,0),0)}
function stars(n){const f=Math.round(n);return `<span class="stars" aria-label="${n.toFixed(1)} sao">${'★'.repeat(f)}${'☆'.repeat(5-f)}</span>`}
function activeListings(){return DB.listings.filter(l=>l.status==='approved')}
function cartKey(){return me()?me().id:'guest'}
function cart(){return DB.carts[cartKey()]||(DB.carts[cartKey()]=[])}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;$('#toast').appendChild(t);setTimeout(()=>t.remove(),4200)}
function requireLogin(msg){if(me())return true;toast(msg||'Vui lòng đăng nhập hoặc đăng ký tài khoản để thực hiện giao dịch.');state.after=location.hash||'#home';closeModal();go('login');return false}

/* ===================== HÌNH MINH HỌA (SVG) ===================== */
function rnd(seed){let h=1779033703;for(const c of String(seed))h=Math.imul(h^c.charCodeAt(0),3432918353),h=h<<13|h>>>19;return()=>{h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return((h^=h>>>16)>>>0)/4294967296}}
const CROP={'Rau muống':{k:'leaf',c:'#3f9b45',c2:'#86c977'},'Cải ngọt':{k:'leaf',c:'#2f8a3a',c2:'#b3df92'},'Mồng tơi':{k:'leaf',c:'#2a6e35',c2:'#4e9447'},'Rau ngót':{k:'leaf',c:'#3b8f3f',c2:'#6dbb5e'},
  'Xà lách':{k:'head',c:'#7fc152',c2:'#c7ea8d'},'Dưa leo':{k:'cuke',c:'#3d7f34',c2:'#a2d27c'},'Cà chua':{k:'tomato',c:'#d8452f',c2:'#4c9a3d'},'Hành lá':{k:'onion',c:'#5bb04f',c2:'#f4f6e4'},
  'Rau dền':{k:'leaf',c:'#a13a5a',c2:'#d16b8a'},'Đậu bắp':{k:'okra',c:'#5d9a3c',c2:'#b9dc8f'},'Ớt':{k:'tomato',c:'#c92a1f',c2:'#3c8a34'},'Cà rốt':{k:'okra',c:'#e57a1f',c2:'#5aa043'},_:{k:'leaf',c:'#4a9a48',c2:'#9fd18a'}};
function cropOf(name){const n=String(name||'');for(const k in CROP)if(k!=='_'&&n.toLowerCase().includes(k.toLowerCase()))return CROP[k];return CROP._}
function prodArt(name,cls){const c=cropOf(name),r=rnd(name);let g='';
  if(c.k==='leaf'){for(let i=0;i<11;i++){const x=40+(i%4)*40+r()*12,y=38+Math.floor(i/4)*34+r()*10,rot=-50+r()*100;g+=`<path d="M${x} ${y+22} Q${x} ${y+8} ${x+2} ${y}" stroke="#2f6e2e" stroke-width="2" fill="none"/><ellipse cx="${x}" cy="${y}" rx="24" ry="11" transform="rotate(${rot} ${x} ${y})" fill="${i%3?c.c:c.c2}"/>`}}
  else if(c.k==='head'){[[70,78],[132,82],[100,64]].forEach(([x,y],i)=>{g+=`<circle cx="${x}" cy="${y}" r="40" fill="${c.c}"/><circle cx="${x}" cy="${y}" r="27" fill="${c.c2}"/><circle cx="${x}" cy="${y}" r="12" fill="#e4f5b5"/>`})}
  else if(c.k==='tomato'){[[62,86],[104,74],[142,90],[86,112],[126,114]].forEach(([x,y])=>{g+=`<circle cx="${x}" cy="${y}" r="24" fill="${c.c}"/><circle cx="${x-8}" cy="${y-8}" r="6" fill="#fff" opacity=".35"/><path d="M${x-10} ${y-20} L${x} ${y-14} L${x+10} ${y-20} L${x+4} ${y-24} L${x} ${y-30} L${x-4} ${y-24}Z" fill="${c.c2}"/>`})}
  else if(c.k==='cuke'){for(let i=0;i<4;i++){const x=40+i*34,y=50+r()*20;g+=`<rect x="${x}" y="${y}" width="26" height="78" rx="13" transform="rotate(${-20+i*12} ${x+13} ${y+39})" fill="${i%2?c.c:'#4f9443'}"/><rect x="${x+8}" y="${y+10}" width="5" height="56" rx="2" transform="rotate(${-20+i*12} ${x+13} ${y+39})" fill="${c.c2}" opacity=".7"/>`}}
  else if(c.k==='onion'){for(let i=0;i<9;i++){const x=52+i*12;g+=`<rect x="${x}" y="${22+r()*14}" width="7" height="92" rx="3" fill="${c.c}"/><rect x="${x-1}" y="102" width="9" height="24" rx="4" fill="${c.c2}"/>`}g+=`<rect x="48" y="96" width="114" height="10" rx="3" fill="#b07a46"/>`}
  else if(c.k==='okra'){for(let i=0;i<6;i++){const x=46+i*22,rot=-15+r()*30;g+=`<path d="M${x} 40 L${x+9} 40 L${x+5} 122 Z" transform="rotate(${rot} ${x+5} 80)" fill="${i%2?c.c:c.c2}"/><rect x="${x+1}" y="32" width="8" height="10" rx="2" transform="rotate(${rot} ${x+5} 80)" fill="#5aa043"/>`}}
  return `<svg viewBox="0 0 200 150" class="${cls||'art'}" role="img" aria-label="Hình minh họa ${esc(name)}"><rect width="200" height="150" fill="#eef6e8"/><rect y="118" width="200" height="32" fill="#e3d2b8"/><ellipse cx="100" cy="128" rx="78" ry="9" fill="#cdb894"/>${g}</svg>`}
function plotArt(p,cls){const c=cropOf(p.crop);let g='';
  for(let i=0;i<5;i++)g+=`<rect x="12" y="${22+i*24}" width="216" height="12" rx="6" fill="#6b4426"/>`;
  if(p.status==='used'&&p.crop&&p.crop!=='Chưa trồng'){for(let i=0;i<5;i++)for(let j=0;j<12;j++){const x=22+j*18,y=27+i*24;g+=`<ellipse cx="${x}" cy="${y-4}" rx="7" ry="9" fill="${(i+j)%2?c.c:c.c2}"/>`}}
  if(p.status==='used'&&(!p.crop||p.crop==='Chưa trồng')){for(let j=0;j<12;j++)g+=`<circle cx="${22+j*18}" cy="50" r="3" fill="#8cc472"/>`}
  if(p.status==='pending')[40,120,200].forEach(x=>g+=`<rect x="${x}" y="30" width="4" height="60" fill="#d9c29a"/><path d="M${x+4} 30 l26 9 l-26 9z" fill="#f3c63f"/>`);
  if(p.status==='sale')g+=`<rect x="70" y="40" width="100" height="44" rx="6" fill="#fff" stroke="#3d82cf" stroke-width="3"/><text x="120" y="68" text-anchor="middle" font-family="Lexend,sans-serif" font-weight="700" font-size="16" fill="#2c6bb0">RAO BÁN</text><rect x="117" y="84" width="6" height="40" fill="#d9c29a"/>`;
  if(p.status==='maint')g+=`<g transform="rotate(-12 120 75)"><rect x="-10" y="62" width="260" height="22" fill="#e2534f"/>${Array.from({length:14},(_,i)=>`<rect x="${-10+i*20}" y="62" width="10" height="22" fill="#fff"/>`).join('')}</g>`;
  if(p.status==='empty')g+=`<rect x="160" y="96" width="60" height="30" rx="4" fill="#fff"/><text x="190" y="116" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#2e7a39">TRỐNG</text>`;
  const img=p.img?`<img src="${p.img}" alt="Ảnh thực tế ô ${esc(p.code)}" class="${cls||'art'}">`:'';
  return img||`<svg viewBox="0 0 240 150" class="${cls||'art'}" role="img" aria-label="Hình minh họa ô đất ${esc(p.code)}"><rect width="240" height="150" fill="#8a5a34"/>${g}<rect x="6" y="6" width="68" height="24" rx="4" fill="#fff" opacity=".92"/><text x="40" y="23" text-anchor="middle" font-family="Lexend,sans-serif" font-weight="700" font-size="14" fill="#1d3a22">${esc(p.code)}</text></svg>`}
function prodImg(p,cls){return p.img?`<img src="${p.img}" alt="${esc(p.name)}" class="${cls||'pimg'}">`:prodArt(p.name,cls)}
function heroArt(){const W=1200,H=460,hz=250;let s=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMax slice" class="hero-art" aria-hidden="true"><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d7eef4"/><stop offset="1" stop-color="#eef7e2"/></linearGradient></defs><rect width="${W}" height="${H}" fill="url(#sky)"/><circle cx="1040" cy="86" r="44" fill="#ffe59a"/>`;
  s+=`<path d="M0 ${hz} C180 ${hz-70} 360 ${hz-40} 520 ${hz-20} S860 ${hz-90} 1200 ${hz-30} V${hz+10} H0Z" fill="#b6d99c"/><path d="M0 ${hz} C240 ${hz-30} 560 ${hz-10} 760 ${hz-26} S1060 ${hz-10} 1200 ${hz-4} V${hz+10} H0Z" fill="#94c57e"/>`;
  s+=`<rect y="${hz}" width="${W}" height="${H-hz}" fill="#a87a4f"/>`;const vx=760;
  for(let i=-9;i<=9;i++){const bx=vx+i*150,tx=vx+i*14;s+=`<polygon points="${bx-55},${H} ${bx+55},${H} ${tx+5},${hz} ${tx-5},${hz}" fill="#5f8f3e"/>`;
    for(let t=0;t<=14;t++){const f=Math.pow(t/14,1.7);const y=hz+(H-hz)*f,x=tx+(bx-tx)*f,r=2+16*f;s+=`<circle cx="${x-r*.9}" cy="${y-r*.4}" r="${r}" fill="${t%2?'#7cc35f':'#4f9b45'}"/><circle cx="${x+r*.9}" cy="${y-r*.4}" r="${r*.85}" fill="${t%2?'#5aa94c':'#86cf69'}"/>`}}
  s+=`<polygon points="${vx-40},${H} ${vx+40},${H} ${vx+3},${hz} ${vx-3},${hz}" fill="#e1caa3"/>`;
  return s+'</svg>'}

  l.sort(f.sort==='price'?(a,b)=>a.priceMonth-b.priceMonth:f.sort==='area'?(a,b)=>b.area-a.area:(a,b)=>a.code.localeCompare(b.code));

   <div class="full btn-row"><button class="btn info">Gửi yêu cầu mua</button><button type="button" class="btn" data-a="chat" data-to="${l.sellerId}" data-ctx="Chào anh/chị, tôi quan tâm ô đất ${esc(p.code)} đang rao bán.">Nhắn tin với người bán</button><button type="button" class="btn" data-a="locate" data-id="${p.id}">Xem trên sơ đồ</button></div></form>`}`)}

/* ===================== CHỢ RAU ===================== */
function marketList(){const f=state.mk;let l=visibleProducts();const q=f.q.trim().toLowerCase();
  if(q)l=l.filter(p=>(p.name+' '+p.desc+' '+(plot(p.plotId)?.code||'')).toLowerCase().includes(q));
  if(f.cat)l=l.filter(p=>p.cat===f.cat);if(f.plot)l=l.filter(p=>p.plotId===f.plot);if(f.price)l=l.filter(p=>p.price<=+f.price);
  l.sort(f.sort==='price'?(a,b)=>a.price-b.price:f.sort==='priced'?(a,b)=>b.price-a.price:f.sort==='rate'?(a,b)=>prodRating(b.id).avg-prodRating(a.id).avg:(a,b)=>b.harvest.localeCompare(a.harvest));
  return l.length?`<p class="muted">${l.length} sản phẩm</p><div class="cards">${l.map(prodCard).join('')}</div>`:'<div class="empty-state">Không tìm thấy sản phẩm phù hợp. Thử từ khóa khác như "rau muống" hoặc "A01".</div>'}
function pageMarket(){const plots=[...new Set(visibleProducts().map(p=>p.plotId))].map(plot).filter(Boolean).sort((a,b)=>a.code.localeCompare(b.code));const f=state.mk;
  return `<section class="wrap page"><div class="sec-head"><div><span class="eyebrow">Thương mại điện tử</span><h2>CHỢ RAU VƯỜN XANH</h2><p class="muted">Rau củ do chính các chủ vườn trồng và thu hoạch. Mỗi sản phẩm ghi rõ ô đất trồng.</p></div>${role()==='owner'?'<a class="btn primary" href="#seller">Đăng bán rau</a>':''}</div>
  <div class="filters"><div class="field" style="grid-column:span 2;min-width:0"><label for="mk-q">Tìm sản phẩm</label><input id="mk-q" type="search" data-i="mkQ" value="${esc(f.q)}" placeholder="Tên rau, mô tả hoặc mã vườn"></div>
   <div class="field"><label for="mk-cat">Loại rau</label><select id="mk-cat" data-c="mkF" data-k="cat"><option value="">Tất cả</option>${CATS.map(c=>`<option ${f.cat===c?'selected':''}>${c}</option>`).join('')}</select></div>
   <div class="field"><label for="mk-plot">Khu vườn</label><select id="mk-plot" data-c="mkF" data-k="plot"><option value="">Tất cả</option>${plots.map(p=>`<option value="${p.id}" ${f.plot===p.id?'selected':''}>Vườn ${esc(p.code)}</option>`).join('')}</select></div>
   <div class="field"><label for="mk-price">Giá tối đa</label><select id="mk-price" data-c="mkF" data-k="price"><option value="">Không giới hạn</option>${[15000,20000,30000].map(v=>`<option value="${v}" ${+f.price===v?'selected':''}>${money(v)}</option>`).join('')}</select></div>
   <div class="field"><label for="mk-sort">Sắp xếp</label><select id="mk-sort" data-c="mkF" data-k="sort"><option value="new">Mới thu hoạch</option><option value="price" ${f.sort==='price'?'selected':''}>Giá thấp đến cao</option><option value="priced" ${f.sort==='priced'?'selected':''}>Giá cao đến thấp</option><option value="rate" ${f.sort==='rate'?'selected':''}>Đánh giá cao</option></select></div></div>
  <div id="mk-list">${marketList()}</div></section>`}
function pageProduct(id){const p=prod(id);if(!p||((p.hidden||p.adminHidden)&&p.sellerId!==me()?.id&&role()!=='admin'))return `<section class="wrap page"><div class="empty-state">Sản phẩm không tồn tại hoặc đã ngừng bán. <a href="#market">Quay lại chợ rau</a></div></section>`;
  const pl=plot(p.plotId),rt=prodRating(p.id),u=me();const revs=DB.reviews.filter(r=>r.pid===p.id&&!r.hidden);
  const canReview=u&&DB.orders.some(o=>o.buyerId===u.id&&o.status==='completed'&&o.items.some(i=>i.pid===p.id))&&!revs.some(r=>r.userId===u.id);
  return `<section class="wrap page"><a href="#market" class="small">← Chợ rau</a><div class="two"><div class="panel" style="padding:0;overflow:hidden">${prodImg(p,'art')}</div>
  <div class="panel"><span class="eyebrow">${esc(p.cat)} · Vườn ${esc(pl?.code)}</span><h2>${esc(p.name)}</h2><div class="price num" style="font-size:1.6rem">${money(p.price)} <small>/ ${esc(p.unit)}</small></div>
   ${rt.n?`<div>${stars(rt.avg)} <span class="muted">${rt.avg.toFixed(1)} · ${rt.n} đánh giá · đã bán ${prodSold(p.id)} ${esc(p.unit)}</span></div>`:'<div class="muted small">Chưa có đánh giá</div>'}
   <dl class="kv"><dt>Khu vực trồng</dt><dd>Vườn ${esc(pl?.code)} (${pl?posText(pl):''})</dd><dt>Người trồng</dt><dd>${esc(uname(p.sellerId))}</dd><dt>Còn lại</dt><dd class="num">${p.qty} ${esc(p.unit)}</dd><dt>Thu hoạch</dt><dd>${fmtD(p.harvest)}</dd><dt>Giao hàng</dt><dd>${p.delivery.map(esc).join(', ')}</dd></dl>
   <p>${esc(p.desc)}</p>
   ${p.qty>0?`<div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center"><div class="qty"><button type="button" data-a="qtyStep" data-d="-1" aria-label="Giảm">−</button><input id="pd-qty" type="number" min="1" max="${p.qty}" value="1" aria-label="Số lượng"><button type="button" data-a="qtyStep" data-d="1" aria-label="Tăng">+</button></div>
   <button class="btn primary" data-a="addCart" data-id="${p.id}" data-q="#pd-qty">Thêm vào giỏ hàng</button><button class="btn earth" data-a="buyNow" data-id="${p.id}">Mua ngay</button></div>`:'<div class="note-box">Sản phẩm tạm hết hàng. Nhắn tin cho người trồng để hỏi đợt thu hoạch tới.</div>'}
   <div class="btn-row"><button class="btn" data-a="chat" data-to="${p.sellerId}" data-ctx="Chào ${esc(uname(p.sellerId))}, tôi hỏi về sản phẩm ${esc(p.name)} (vườn ${esc(pl?.code)}): ">Nhắn tin với người bán</button>${pl?`<button class="btn" data-a="plot" data-id="${pl.id}">Xem ô đất trồng</button>`:''}</div></div></div>
  <div class="panel"><h3>Đánh giá sản phẩm</h3>${revs.length?`<div class="list">${revs.map(r=>`<div class="row-item"><div><b>${esc(uname(r.userId))}</b> ${stars(r.rating)}<div>${esc(r.text)}</div><div class="small muted">${fmtD(r.date)}</div></div></div>`).join('')}</div>`:'<p class="muted">Chưa có đánh giá nào.</p>'}
   ${canReview?`<form data-f="review" class="form-grid"><input type="hidden" name="pid" value="${p.id}"><div class="field"><label for="rv-r">Số sao</label><select id="rv-r" name="rating">${[5,4,3,2,1].map(n=>`<option value="${n}">${n} sao</option>`).join('')}</select></div><div class="field"><label for="rv-t">Nhận xét</label><input id="rv-t" name="text" required placeholder="Rau có tươi không, giao có đúng hẹn không?"></div><div class="full"><button class="btn primary">Gửi đánh giá</button></div></form>`:'<p class="small muted">Bạn có thể đánh giá sau khi đơn hàng chứa sản phẩm này hoàn thành.</p>'}</div></section>`}

/* ===================== GIỎ HÀNG & ĐẶT HÀNG ===================== */
function groupCart(){const g={};for(const it of cart()){const p=prod(it.pid);if(!p)continue;(g[p.sellerId]=g[p.sellerId]||[]).push({...it,p})}return g}
function shipFee(sub){return sub>=DB.settings.freeShip?0:DB.settings.shipFee}
function cartTotals(){const g=groupCart();let sub=0,ship=0;for(const s in g){const t=g[s].reduce((a,i)=>a+i.p.price*i.qty,0);sub+=t;ship+=shipFee(t)}return {sub,ship,total:sub+ship,g}}
function pageCart(){const {sub,ship,total,g}=cartTotals();
  if(!cart().length)return `<section class="wrap page"><h2>Giỏ hàng</h2><div class="empty-state">Giỏ hàng đang trống. <a href="#market">Vào chợ rau</a> để chọn rau sạch.</div></section>`;
  return `<section class="wrap page"><h2>Giỏ hàng</h2><div class="two"><div class="list">${Object.entries(g).map(([sid,items])=>{const t=items.reduce((a,i)=>a+i.p.price*i.qty,0);return `<div class="panel"><h3>Người bán: ${esc(uname(sid))}</h3>
   ${items.map(i=>`<div class="row-item" style="border:0;padding:0"><div style="display:flex;gap:12px;align-items:center"><div style="width:84px;flex-shrink:0;border-radius:8px;overflow:hidden">${prodImg(i.p)}</div><div><b>${esc(i.p.name)}</b><div class="small muted">Vườn ${esc(plot(i.p.plotId)?.code)} · ${money(i.p.price)}/${esc(i.p.unit)} · còn ${i.p.qty}</div></div></div>
   <div class="btn-row" style="align-items:center"><div class="qty"><button data-a="cartQty" data-id="${i.pid}" data-d="-1" aria-label="Giảm">−</button><input type="number" value="${i.qty}" min="1" data-c="cartSet" data-id="${i.pid}" aria-label="Số lượng ${esc(i.p.name)}"><button data-a="cartQty" data-id="${i.pid}" data-d="1" aria-label="Tăng">+</button></div><b class="num" style="min-width:100px;text-align:right">${money(i.p.price*i.qty)}</b><button class="btn sm danger" data-a="cartDel" data-id="${i.pid}">Xóa</button></div></div>`).join('')}
   <div class="small muted" style="text-align:right">Tạm tính ${money(t)} · Phí vận chuyển ${shipFee(t)?money(shipFee(t)):'Miễn phí'}</div></div>`}).join('')}</div>
   <div class="panel"><h3>Tổng đơn</h3><dl class="kv"><dt>Tiền hàng</dt><dd class="num">${money(sub)}</dd><dt>Phí vận chuyển</dt><dd class="num">${money(ship)}</dd><dt>Tổng cộng</dt><dd class="price num">${money(total)}</dd></dl>
   <p class="small muted">Mỗi người bán tạo một đơn riêng. Miễn phí vận chuyển cho đơn từ ${money(DB.settings.freeShip)} trở lên với cùng người bán.</p><a class="btn primary" href="#checkout">Tiến hành đặt hàng</a></div></div></section>`}
function pageCheckout(){if(!me())return requireLogin('Vui lòng đăng nhập để đặt hàng.'),'';const u=me();const {sub,ship,total,g}=cartTotals();
  if(!cart().length)return `<section class="wrap page"><div class="empty-state">Giỏ hàng trống. <a href="#market">Vào chợ rau</a></div></section>`;
  return `<section class="wrap page"><h2>Đặt hàng</h2><form data-f="order" class="two"><div class="panel"><h3>Thông tin người mua</h3><div class="form-grid">
   <div class="field"><label for="co-name">Họ và tên</label><input id="co-name" name="name" required value="${esc(u.name)}"></div><div class="field"><label for="co-phone">Số điện thoại</label><input id="co-phone" name="phone" required value="${esc(u.phone)}"></div>
   <div class="field full"><label for="co-addr">Địa chỉ nhận hàng</label>${u.addresses.length?`<select id="co-addr" name="addr">${u.addresses.map(a=>`<option>${esc(a)}</option>`).join('')}<option value="__new">+ Nhập địa chỉ mới</option><option>Nhận tại vườn</option></select>`:`<input id="co-addr" name="addr" required placeholder="Số nhà, đường, phường">`}</div>
   ${u.addresses.length?`<div class="field full"><label for="co-new">Địa chỉ mới (nếu chọn "Nhập địa chỉ mới")</label><input id="co-new" name="newaddr" placeholder="Số nhà, đường, phường"></div>`:''}
   <div class="field full"><label for="co-note">Ghi chú giao hàng</label><input id="co-note" name="note" placeholder="Ví dụ: giao trước 8 giờ sáng"></div></div>
   <h3>Phương thức thanh toán</h3><div class="list">${Object.entries(PAYMENT_METHODS).map(([k,m],i)=>`<label class="radio-card ${m.enabled?'':'off'}"><input type="radio" name="pay" value="${k}" ${i===0?'checked':''} ${m.enabled?'':'disabled'}><span><b>${m.label}</b><br><span class="small muted">${m.hint}</span></span></label>`).join('')}</div>
   <div class="note-box small">Chuyển khoản: ${esc(DB.settings.bank)}. Nội dung chuyển khoản ghi mã đơn hàng.</div></div>
   <div class="panel"><h3>Tóm tắt đơn hàng</h3>${Object.entries(g).map(([sid,items])=>`<div><b>Người bán: ${esc(uname(sid))}</b><ul style="margin:4px 0 0;padding-left:20px">${items.map(i=>`<li>${esc(i.p.name)} × ${i.qty} ${esc(i.p.unit)} – <span class="num">${money(i.p.price*i.qty)}</span></li>`).join('')}</ul></div>`).join('')}
   <dl class="kv"><dt>Tiền hàng</dt><dd class="num">${money(sub)}</dd><dt>Phí vận chuyển</dt><dd class="num">${money(ship)}</dd><dt>Tổng thanh toán</dt><dd class="price num">${money(total)}</dd></dl><button class="btn primary">Đặt hàng (${Object.keys(g).length} đơn)</button><p class="small muted">Số lượng tồn kho chỉ bị trừ khi người bán xác nhận đơn.</p></div></form></section>`}

/* ===================== ĐƠN HÀNG ===================== */
function orderCard(o,asSeller){const idx=OFLOW.indexOf(o.status);
  return `<div class="panel"><div class="sec-head"><div><b>Đơn ${o.id}</b> <span class="muted small">· ${fmtT(o.date)}</span><div class="small muted">${asSeller?`Người mua: ${esc(o.name)} · ${esc(o.phone)}`:`Người bán: ${esc(uname(o.sellerId))}`}</div></div>${pill(OST[o.status],OCLS[o.status])}</div>
   <div class="steps">${o.status==='cancelled'?'<span>Đơn đã hủy</span>':OFLOW.map((s,i)=>`<span class="${i<=idx?'done':''}">${OST[s]}</span>`).join('')}</div>
   <ul style="margin:0;padding-left:20px">${o.items.map(i=>`<li>${esc(i.name)} × ${i.qty} ${esc(i.unit)} – <span class="num">${money(i.price*i.qty)}</span></li>`).join('')}</ul>
   <div class="meta"><span>Giao tới: ${esc(o.address)}</span><span>${PAYMENT_METHODS[o.pay].label}${o.paid?' · đã thanh toán':''}</span><span>Phí ship ${money(o.ship)}</span><b class="num" style="color:var(--ink)">Tổng ${money(o.total)}</b></div>
   <div class="btn-row">${asSeller?sellerOrderBtns(o):buyerOrderBtns(o)}</div></div>`}
function buyerOrderBtns(o){const b=[];if(o.status==='pending')b.push(`<button class="btn sm danger" data-a="ordSet" data-id="${o.id}" data-s="cancelled">Hủy đơn</button>`);
  if(o.status==='delivered')b.push(`<button class="btn sm primary" data-a="ordSet" data-id="${o.id}" data-s="completed">Đã nhận hàng</button>`);
  if(o.status==='completed')o.items.forEach(i=>{if(!DB.reviews.some(r=>r.pid===i.pid&&r.userId===o.buyerId))b.push(`<a class="btn sm" href="#sp-${i.pid}">Đánh giá ${esc(i.name)}</a>`)});
  b.push(`<button class="btn sm" data-a="chat" data-to="${o.sellerId}" data-ctx="Về đơn hàng ${o.id}: ">Nhắn người bán</button>`);return b.join('')}
const NEXT={pending:['confirmed','Xác nhận đơn'],confirmed:['preparing','Bắt đầu chuẩn bị hàng'],preparing:['shipping','Bắt đầu giao hàng'],shipping:['delivered','Đã giao hàng']};
function sellerOrderBtns(o){const b=[];if(NEXT[o.status])b.push(`<button class="btn sm primary" data-a="ordSet" data-id="${o.id}" data-s="${NEXT[o.status][0]}">${NEXT[o.status][1]}</button>`);
  if(['pending','confirmed','preparing'].includes(o.status))b.push(`<button class="btn sm danger" data-a="ordSet" data-id="${o.id}" data-s="cancelled">Hủy đơn</button>`);
  b.push(`<button class="btn sm" data-a="chat" data-to="${o.buyerId}" data-ctx="Về đơn hàng ${o.id}: ">Nhắn người mua</button>`);return b.join('')}
function pageOrders(){const u=me();if(!u)return `<section class="wrap page"><h2>Đơn hàng</h2><div class="empty-state">Đăng nhập để xem và theo dõi đơn hàng, đăng ký thuê đất và giao dịch mua bán đất. <a href="#login">Đăng nhập</a></div></section>`;
  const t=state.ordTab;const ords=DB.orders.filter(o=>o.buyerId===u.id);const rs=DB.rentals.filter(r=>r.userId===u.id);const ds=DB.deals.filter(d=>d.buyerId===u.id||d.sellerId===u.id);
  return `<section class="wrap page"><div class="sec-head"><div><h2>Đơn hàng & giao dịch của tôi</h2><p class="muted">Theo dõi đơn mua rau, đăng ký thuê đất và giao dịch đất ở cùng một chỗ.</p></div>${role()==='owner'?'<a class="btn" href="#seller">Đơn bán của tôi (Kênh chủ vườn)</a>':''}</div>
  <div class="tabs" role="tablist">${[['buy','Đơn mua rau',ords.length],['rent','Thuê đất',rs.length],['land','Giao dịch đất',ds.length]].map(([k,l,n])=>`<button role="tab" class="${t===k?'on':''}" data-a="ordTab" data-t="${k}">${l} (${n})</button>`).join('')}</div>
  ${t==='buy'?(ords.length?`<div class="list">${ords.map(o=>orderCard(o,false)).join('')}</div>`:'<div class="empty-state">Bạn chưa có đơn mua rau. <a href="#market">Vào chợ rau</a></div>')
   :t==='rent'?(rs.length?`<div class="list">${rs.map(rentalRow).join('')}</div>`:'<div class="empty-state">Chưa có đăng ký thuê. <a href="#rent">Thuê đất</a></div>')
   :(ds.length?`<div class="list">${ds.map(dealRow).join('')}</div>`:'<div class="empty-state">Chưa có giao dịch đất. <a href="#land">Mua bán đất</a></div>')}</section>`}

/* ===================== TIN NHẮN ===================== */
function threads(){const u=me(),m={};for(const x of DB.msgs){if(x.from!==u.id&&x.to!==u.id)continue;const o=x.from===u.id?x.to:x.from;if(!m[o]||m[o].time<x.time)m[o]=x}return Object.entries(m).sort((a,b)=>b[1].time.localeCompare(a[1].time))}
function pageMessages(){const u=me();if(!u)return requireLogin('Đăng nhập để nhắn tin với người bán.'),'';const th=threads();let w=state.chatWith||th[0]?.[0];
  if(w){DB.msgs.forEach(m=>{if(m.from===w&&m.to===u.id&&!m.read)m.read=true});save();setTimeout(()=>{renderHeader();const b=$('.msgs');if(b)b.scrollTop=b.scrollHeight},0)}
  const conv=w?DB.msgs.filter(m=>(m.from===u.id&&m.to===w)||(m.from===w&&m.to===u.id)):[];
  const list=th.map(([o,x])=>`<button class="${o===w?'on':''}" data-a="openThread" data-to="${o}"><b>${esc(uname(o))}</b><span class="small muted">${esc(x.text)}</span><span class="small muted">${fmtT(x.time)}${DB.msgs.some(m=>m.from===o&&m.to===u.id&&!m.read)?' · <b style="color:var(--bad)">mới</b>':''}</span></button>`);
  if(w&&!th.some(([o])=>o===w))list.unshift(`<button class="on"><b>${esc(uname(w))}</b><span class="small muted">Cuộc trò chuyện mới</span></button>`);
  return `<section class="wrap page"><div><h2>Tin nhắn</h2><p class="muted">Hỏi về sản phẩm, thương lượng giá và hẹn thời gian giao hàng trực tiếp với người bán.</p></div>
  <div class="chat"><div class="threads">${list.join('')||'<p class="muted" style="padding:14px">Chưa có cuộc trò chuyện. Bấm "Nhắn tin với người bán" ở trang sản phẩm hoặc tin đăng đất.</p>'}</div>
  <div class="conv">${w?`<div class="conv-h">${esc(uname(w))} <span class="muted small">· ${ROLE[user(w)?.role||'guest']}</span></div><div class="msgs">${conv.map(m=>`<div class="msg ${m.from===u.id?'mine':''}">${esc(m.text)}<time>${fmtT(m.time)}</time></div>`).join('')||'<p class="muted">Hãy gửi lời chào đầu tiên.</p>'}</div>
   <div class="quick">${['Sản phẩm này còn hàng không ạ?','Có bớt giá được không ạ?','Khi nào giao được hàng ạ?','Tôi muốn nhận tại vườn.'].map(q=>`<button type="button" data-a="quickMsg" data-t="${esc(q)}">${esc(q)}</button>`).join('')}</div>
   <form data-f="msg"><input type="hidden" name="to" value="${w}"><input id="msg-text" name="text" required autocomplete="off" placeholder="Nhập tin nhắn..." value="${esc(state.chatDraft)}" aria-label="Nội dung tin nhắn"><button class="btn primary">Gửi</button></form>`
   :'<div class="empty-state" style="margin:20px">Chọn một cuộc trò chuyện.</div>'}</div></div>
  <p class="small muted">Bản chạy thử: để xem phía người nhận trả lời, đăng nhập bằng tài khoản người kia.</p></section>`}

     <td>${p.adminHidden?pill('Bị ẩn bởi BQL','bad'):p.hidden?pill('Đang ẩn',''):pill('Đang bán','ok')}</td><td><div class="btn-row"><button class="btn sm" data-a="prodForm" data-id="${p.id}">Sửa</button><button class="btn sm" data-a="prodHide" data-id="${p.id}">${p.hidden?'Hiện':'Ẩn'}</button><button class="btn sm danger" data-a="prodDel" data-id="${p.id}">Xóa</button></div></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty-state">Bạn chưa đăng sản phẩm nào.</div>'}`;

function setOrderStatus(o,s,by){if(o.status===s)return true;
  if(s==='confirmed'&&!o.stockDeducted){for(const i of o.items){const p=prod(i.pid);if(!p||p.qty<i.qty){toast(`Không đủ tồn kho cho "${i.name}" (còn ${p?p.qty:0}). Hãy cập nhật số lượng trước khi xác nhận.`);return false}}
    o.items.forEach(i=>prod(i.pid).qty-=i.qty);o.stockDeducted=true}
  if(s==='cancelled'&&o.stockDeducted){o.items.forEach(i=>{const p=prod(i.pid);if(p)p.qty+=i.qty});o.stockDeducted=false}
  if(['preparing','shipping','delivered','completed'].includes(s)&&!o.stockDeducted){if(!setOrderStatus(o,'confirmed',by))return false}
  o.status=s;o.history.push({s,t:now()});if(s==='completed'&&o.pay==='cod')o.paid=true;
  if(by!==o.buyerId)notify(o.buyerId,`Đơn ${o.id}: ${OST[s]}.`,'orders');if(by!==o.sellerId)notify(o.sellerId,`Đơn ${o.id}: ${OST[s]} (cập nhật bởi ${by===o.buyerId?'người mua':'Ban quản lý'}).`,'seller');return true}

function doLogin(u){if(!u)return;if(u.locked){toast('Tài khoản này đã bị khóa. Vui lòng liên hệ Ban quản lý.');return}
  const g=DB.carts.guest||[];if(g.length){const c=DB.carts[u.id]||(DB.carts[u.id]=[]);g.forEach(i=>{if(prod(i.pid)?.sellerId===u.id)return;const e=c.find(x=>x.pid===i.pid);if(e)e.qty+=i.qty;else c.push(i)});DB.carts.guest=[]}
  DB.session=u.id;save();toast(`Xin chào ${u.name} (${ROLE[u.role]}).`);const a=state.after;state.after=null;
  location.hash=a&&a!=='#login'?a:(u.role==='admin'?'#admin':u.role==='owner'?'#seller':'#home');render()}

 forgot(fd){const id=fd.get('id').trim().toLowerCase().replace(/\s/g,'');const u=DB.users.find(x=>x.phone===id||x.email.toLowerCase()===id);if(!u){toast('Không tìm thấy tài khoản với thông tin này.');return}
   state.resetUser=u.id;state.resetCode=String(Math.floor(100000+Math.random()*900000));render()},
 reset(fd){if(fd.get('code').trim()!==state.resetCode){toast('Mã xác nhận chưa đúng.');return}user(state.resetUser).pass=fd.get('pw');state.resetUser=null;state.loginTab='login';save();toast('Đã đặt lại mật khẩu. Vui lòng đăng nhập.');render()},
 profile(fd){const u=me(),phone=fd.get('phone').replace(/[\s.]/g,'');if(!phoneOK(phone)){toast('Số điện thoại cần 10 chữ số, bắt đầu bằng 0.');return}if(DB.users.some(x=>x.id!==u.id&&x.phone===phone)){toast('Số điện thoại đã thuộc tài khoản khác.');return}
   u.name=fd.get('name').trim();u.phone=phone;u.email=fd.get('email').trim();save();toast('Đã lưu thông tin.');render()},
 chpw(fd){const u=me();if(u.pass!==fd.get('old')){toast('Mật khẩu hiện tại chưa đúng.');return}u.pass=fd.get('pw');save();toast('Đã đổi mật khẩu.');render()},
 addAddr(fd){me().addresses.push(fd.get('addr').trim());save();render()},
 product(fd){const u=me(),id=fd.get('id');const pl=plot(fd.get('plot'));if(!pl||!(pl.userId===u.id||pl.ownerId===u.id)){toast('Bạn chỉ được đăng bán rau từ ô đất mình sở hữu hoặc đang thuê.');return}
   const deliv=fd.getAll('delivery');if(!deliv.length){toast('Chọn ít nhất một phương thức giao hàng.');return}
   const data={name:fd.get('name').trim(),plotId:pl.id,cat:fd.get('cat'),unit:fd.get('unit'),price:+fd.get('price'),qty:+fd.get('qty'),harvest:fd.get('harvest'),delivery:deliv,desc:fd.get('desc').trim()};
   if(id){const p=prod(id);Object.assign(p,data);if(fd.get('img'))p.img=fd.get('img')}else DB.products.unshift({id:nid('sp'),sellerId:u.id,...data,img:fd.get('img')||null,hidden:false,adminHidden:false,created:now()});
   save();closeModal();toast(id?'Đã lưu sản phẩm.':'Đã đăng sản phẩm lên Chợ rau.');state.sellerTab='products';render()},
 plotCrop(fd){const p=plot(fd.get('id'));p.crop=fd.get('crop').trim();if(fd.get('img'))p.img=fd.get('img');save();toast(`Đã cập nhật ô ${p.code}.`);render()},
 addPlot(fd){const side=fd.get('side'),l=sidePlots(side);const nums=DB.plots.filter(p=>p.side===side).map(p=>parseInt(p.code.slice(1))||0);const n=(nums.length?Math.max(...nums):0)+1;const area=+fd.get('area');const pm=+fd.get('pm')||area*10000;
   const code=side+String(n).padStart(2,'0');DB.plots.push({id:nid('pl'),code,side,order:l.length,area,priceMonth:pm,priceYear:pm*10,salePrice:0,status:'empty',userId:null,ownerId:null,crop:'',img:null,note:'',prevStatus:null});save();toast(`Đã thêm ô ${code}.`);render()},
 editPlot(fd){const p=plot(fd.get('id'));const code=fd.get('code').trim().toUpperCase();if(DB.plots.some(x=>x.id!==p.id&&x.code===code)){toast(`Mã ${code} đã tồn tại.`);return}
   const st=fd.get('status');if(st==='sale'&&!DB.listings.some(l=>l.plotId===p.id&&l.status==='approved')){toast('Muốn chuyển sang "Đang rao bán", chủ sở hữu cần đăng tin và được duyệt ở mục Kiểm duyệt tin đăng.');return}
   Object.assign(p,{code,area:+fd.get('area'),priceMonth:+fd.get('pm'),priceYear:+fd.get('py'),status:st,crop:fd.get('crop').trim(),userId:fd.get('userId')||null,ownerId:fd.get('ownerId')||null,note:fd.get('note').trim()});
   if(fd.get('img'))p.img=fd.get('img');if(fd.get('rmimg'))p.img=null;if(st==='empty'){p.userId=null;p.pendingBy=null}save();closeModal();toast(`Đã lưu ô ${p.code}.`);render()},
 listReject(fd){const l=DB.listings.find(x=>x.id===fd.get('id'));l.status='rejected';l.reason=fd.get('reason').trim();notify(l.sellerId,`Tin đăng bán ô ${plot(l.plotId).code} bị từ chối: ${l.reason}.`,'land');save();closeModal();render()},
 broadcast(fd){const to=fd.get('to'),text=fd.get('text').trim();const l=DB.users.filter(u=>u.role!=='admin'&&(to==='all'||u.role===to));l.forEach(u=>notify(u.id,'[Ban quản lý] '+text,''));save();toast(`Đã gửi thông báo tới ${l.length} người dùng.`);render()},
 feedback(fd){DB.feedback.unshift({id:nid('fb'),name:fd.get('name').trim(),phone:fd.get('phone').trim(),text:fd.get('text').trim(),time:now(),done:false});notify('admin',`Phản hồi mới từ ${fd.get('name')}.`,'admin');save();closeModal();toast('Đã gửi phản hồi tới Ban quản lý.');renderHeader()}
};

/* ===================== SỰ KIỆN ===================== */
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=A[t.dataset.a];if(!a)return;if(t.tagName==='A')e.preventDefault();a(t.dataset,t,e)});
document.addEventListener('submit',e=>{const f=e.target;if(!f.dataset.f)return;e.preventDefault();F[f.dataset.f]?.(new FormData(f),f)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modal-root').innerHTML)closeModal()});
let qT;document.addEventListener('input',e=>{const t=e.target;if(t.dataset.i==='mkQ'){state.mk.q=t.value;clearTimeout(qT);qT=setTimeout(()=>{$('#mk-list').innerHTML=marketList()},180)}});
document.addEventListener('change',e=>{const t=e.target,c=t.dataset.c;
  if(t.type==='file'&&t.dataset.into){const f=t.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{const img=new Image();img.onload=()=>{const s=Math.min(1,720/Math.max(img.width,img.height));const cv=document.createElement('canvas');cv.width=img.width*s;cv.height=img.height*s;cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
    const url=cv.toDataURL('image/jpeg',.72);t.form.elements[t.dataset.into].value=url;const pv=t.parentElement.querySelector('.img-prev');if(pv){pv.src=url;pv.hidden=false}};img.onerror=()=>toast('Không đọc được ảnh này. Hãy chọn ảnh JPG hoặc PNG.');img.src=rd.result};rd.readAsDataURL(f);return}
  if(!c)return;const id=t.dataset.id;
  if(c==='rentF'){state.rent[t.dataset.k]=t.value;$('#rent-list').innerHTML=rentList()}
  if(c==='landF'){state.land[t.dataset.k]=t.value;$('#land-list').innerHTML=landList()}
  if(c==='mkF'){state.mk[t.dataset.k]=t.value;$('#mk-list').innerHTML=marketList()}
  if(c==='rentTerm'){$('#r-total').textContent=money(rentTotal(plot(id),t.value))}
  if(c==='cartSet'){const it=cart().find(i=>i.pid===id),p=prod(id);it.qty=Math.max(1,Math.min(p.qty,parseInt(t.value)||1));if((parseInt(t.value)||1)>p.qty)toast(`Chỉ còn ${p.qty} ${p.unit}.`);save();render()}
  if(c==='qPrice'){const p=prod(id);p.price=Math.max(0,+t.value||0);save();toast(`Đã cập nhật giá ${p.name}: ${money(p.price)}.`)}
  if(c==='qQty'){const p=prod(id);p.qty=Math.max(0,parseInt(t.value)||0);save();toast(`Đã cập nhật tồn kho ${p.name}: ${p.qty} ${p.unit}.`)}
  if(c==='plotStatus'){const p=plot(id);if(t.value==='sale'&&!DB.listings.some(l=>l.plotId===p.id&&l.status==='approved')){toast('Cần có tin rao bán đã duyệt để chuyển sang "Đang rao bán".');t.value=p.status;return}p.status=t.value;if(t.value==='empty'){p.userId=null;p.pendingBy=null;p.crop=''}save();toast(`Ô ${p.code}: ${PST[p.status].t}.`);render()}
  if(c==='userRole'){const u=user(id);u.role=t.value;save();toast(`${u.name} giờ là ${ROLE[u.role]}.`);render()}
  if(c==='userFilter'){state.userRoleFilter=t.value;render()}
  if(c==='orderFilter'){state.adminOrderFilter=t.value;render()}
  if(c==='adminOrdStatus'){const o=DB.orders.find(x=>x.id===id);if(setOrderStatus(o,t.value,me().id)){save();toast(`Đơn ${o.id}: ${OST[o.status]}.`)}render()}
});
window.addEventListener('hashchange',()=>{state.menuOpen=false;closeModal();render();window.scrollTo(0,0)});
load();renderFooter();render();
</script>
